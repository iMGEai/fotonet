# fotonetn: fotonet v1.1 nano tier.
# Deployed at 640 (fused, training-only heads removed): 2,854,444 params, 6.951 GFLOPs,
# under the YOLO27n gate (3.0M params, 7.2 GFLOPs).
# The architecture fingerprint hashes graph_version and this layout; editing a
# value here makes a different model that cannot load this tier's weights.
model_id: fotonetn
generation: v1.1
graph_version: 1.1.1
layout:
  stem_channels: 16
  p2_channels: 48
  widths: [64, 128, 256]
  depths: [0, 2, 2, 1]  # CSP-Star blocks at P2, P3, P4, P5 (0 skips the stage block)
  neck_channels: [64, 128, 256]
  neck_depths: [1, 1, 1]
  head_hidden: [48, 96]  # deployed head towers: regression, classification
  attn_p5: 1
  attn_p4: 0
  head_levels: [3, 4, 5]
# Parts this model is assembled from (name@major). graph_version 1.1.1 pins them.
parts:
  backbone: backbone.cspstar@1
  neck: neck.pan_cspstar@1
  head: head.o2o_o2m@1
  blocks: [nn.conv@1, nn.repconv@1, nn.starblock@1, nn.cspstar@1, nn.sppf@1, nn.attention@1, nn.psa_block@1, nn.psa@1]
