# fotonetnr: alpha layout, fotonets at half width. Not released; no published weights.
# Same parts, graph code and output contract as fotonetn. It moves budget from the head and the wide
# P2/P5 layers into feature depth (docs/internal/layer-reallocation.md).
# Deployed at 640 (fused, training-only heads removed): 2,888,108 params, 6.997 GFLOPs,
# under the YOLO27n gate (3.0M params, 7.2 GFLOPs).
# The fingerprint hashes the model id and this layout, so a fotonetn checkpoint is refused here.
model_id: fotonetnr
generation: v1.1
graph_version: 1.1.1
layout:
  stem_channels: 16
  p2_channels: 32
  widths: [64, 128, 256]
  depths: [1, 2, 4, 2]  # CSP-Star blocks at P2, P3, P4, P5
  neck_channels: [64, 128, 192]
  neck_depths: [1, 2, 1]
  head_hidden: [32, 80]  # deployed head towers: regression, classification
  attn_p5: 1
  attn_p4: 0
  head_levels: [3, 4, 5]
parts:
  backbone: backbone.cspstar@1
  neck: neck.pan_cspstar@1
  head: head.o2o_o2m@1
  blocks: [nn.conv@1, nn.repconv@1, nn.starblock@1, nn.cspstar@1, nn.sppf@1, nn.attention@1, nn.psa_block@1, nn.psa@1]
