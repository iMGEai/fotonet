# fotonetl: fotonet v1.1 large tier.
# Deployed at 640 (fused, training-only heads removed): 70,320,460 params, 161.506 GFLOPs,
# under the YOLO27l gate (72.3M params, 165.3 GFLOPs).
# The architecture fingerprint hashes graph_version and this layout; editing a
# value here makes a different model that cannot load this tier's weights.
model_id: fotonetl
generation: v1.1
graph_version: 1.1.1
layout:
  stem_channels: 48
  p2_channels: 128
  widths: [288, 576, 960]
  depths: [1, 3, 6, 4]  # CSP-Star blocks at P2, P3, P4, P5 (0 skips the stage block)
  neck_channels: [288, 512, 896]
  neck_depths: [2, 3, 3]
  head_hidden: [128, 288]  # deployed head towers: regression, classification
  attn_p5: 4
  attn_p4: 2
  head_levels: [3, 4, 5]
# Parts this model is assembled from (name@major). graph_version 1.1.1 pins them.
parts:
  backbone: backbone.cspstar@1
  neck: neck.pan_cspstar@1
  head: head.o2o_o2m@1
  blocks: [nn.conv@1, nn.repconv@1, nn.starblock@1, nn.cspstar@1, nn.sppf@1, nn.attention@1, nn.psa_block@1, nn.psa@1]
