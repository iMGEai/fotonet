# FOTONET v1.1 scratch recipe: fotonetn.
# Layout: stem 16, P2 48, widths 64/128/256, CSP-Star depths 0/2/2/1, attention at P5.
# Deployed cost at 640 (fused, training-only heads removed): 2,854,444 params, 6.951 GFLOPs,
# at least 1% under the YOLO27n gate (python -m fotonet.versions.v1_1.budget).
# Direct LTRB regression. The deployed O2O head trains on detached features;
# the training-only O2M head and its objectness branch teach the backbone.

model: fotonetn
pretrained: false
resume: false

train:
  epochs: 500
  imgsz: 640
  # Progressive resize (v1 parity).  Most of the run happens below 640, which
  # cuts dataloading and head cost without changing what the model is.  The
  # 576->640 transition still leaves 30+ epochs of constant LR to re-stabilize.
  imgsz_schedule:
    - [0.35, 512]
    - [0.35, 576]
    - [0.30, 640]
  nbs: 128
  batch: 16
  workers: 4
  # Pre-decoded image blob: disabled by default (requires ~92 GB disk space for COCO).
  predecode: false
  predecode_dir: null
  predecode_max_side: 720
  close_mosaic: 15
  out_dir: runs/train
  lr_scheduler: wsd
  wsd_decay_fraction: 0.20
  grad_clip: 10.0
  # validation parity with the v1 protocol (FULL val every epoch, unchanged)
  val_period: 1
  val_batch: 8
  val_workers: 2
  best_metric: mAP50_95

optimizer:
  name: adamw
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.05
  warmup_epochs: 3
  ema_decay: 0.99985
  ema_tau: 2000

augment:
  mosaic: 0.90
  mixup: 0.0
  copy_paste: 0.0
  scale: 0.562
  fliplr: 0.606
  flipud: 0.0
  degrees: 1.11
  shear: 1.46
  translate: 0.071
  hsv_h: 0.014
  hsv_s: 0.645
  hsv_v: 0.566
  bgr: 0.106

loss:
  w_box: 7.5
  # Direct regression has no distribution-focal term. The key is kept so
  # older recipe readers do not invent one.
  w_dfl: 0.0
  w_o2o: 1.0
  # Off until a measured run shows the auxiliary head is a useful teacher.
  w_cons: 0.0
  quality_start_epoch: 15
  quality_warmup_epochs: 30
  # Starting values of the deployed head's duplicate controls; knob_schedule below moves them.
  w_runner_up: 1.0
  o2o_neg_alpha: 0.75
  o2o_neg_gamma: 2.0

# Settings that change at fixed epochs. Each entry holds from its epoch on and is applied at the
# epoch start. This is the schedule the published fotonetn weights were trained with, so the run
# can be reproduced as it happened:
#   205: about 62% of the deployed head's confident boxes were same-class duplicates. A
#        stronger negative loss on runner-up anchors and a flatter varifocal negative weight
#        brought that to about 17% by epoch 232.
#   232-259: w_runner_up stepped down to win back recall, with duplicates still low.
#   378, 416: hand-tuned values; the second set holds through the decay to the end.
knob_schedule:
  - {epoch: 205, w_runner_up: 4.0, o2o_neg_alpha: 1.0, o2o_neg_gamma: 1.0}
  - {epoch: 232, w_runner_up: 3.0}
  - {epoch: 249, w_runner_up: 2.0}
  - {epoch: 259, w_runner_up: 1.5}
  - {epoch: 378, w_runner_up: 4.0, o2o_neg_alpha: 0.75, o2o_neg_gamma: 0.8}
  - {epoch: 416, w_runner_up: 2.5, o2o_neg_alpha: 1.0, o2o_neg_gamma: 1.0}

# With the O2O head detached, O2M is the backbone's only teacher: every step,
# never disabled.
o2m:
  every_n_steps: 1
  disable_epoch: 0
  start_epoch: 1

matcher:
  alpha: 0.5
  beta: 6.0
  topk: 8
  # mmax is a SAFETY CAP, not an operating point: GT beyond this are dropped
  # from assignment and silently trained as background (mosaic of 4 crowded
  # COCO images overflows 96).  The trainer now slices the matcher's M down
  # to the batch's real max GT count, bucketed, so a large cap costs nothing
  # on the common batch.
  mmax: 160
  slack_cells: 0.75
  # ONE o2o winner.  The decode is NMS-free (top-k over anchors, no NMS), so
  # every extra winner is a permanent false positive on a real GT: COCO
  # matches a GT once, and 3 winners regress to the same box.  That put a
  # hard precision ceiling of ~1/3 on the deployed head and is the measured
  # root cause of the 128-image gate sitting at P=0.131 for 500 epochs.
  # Rank-decayed extra winners are only useful if the decode deduplicates;
  # it does not, so o2o_topk must be 1.
  o2o_topk: 1
  # O2O winner: the O2M alignment metric scored on the O2O head (YOLOv10
  # consistent matching), including O2M's early center-prior blend.
  o2o_metric: consistent
  # o2o_beta and o2o_center_prior apply only to o2o_metric: self (and to the
  # O2O fallback when no anchor scores above zero).
  o2o_beta: 2.0
  o2o_center_prior: 5.0

smoke_limits:
  epochs: 1
  max_images: 512
  imgsz: 640
